    - budget
    - ledger
    - invoices
    - forecast
    - cost-allocation
  tools:
    - accounting-system
    - erp
    - spreadsheet-analysis
    - approval-workflow
    - reporting
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
