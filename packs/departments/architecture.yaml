version: 1
id: architecture
kind: DepartmentResourcePack
status: PROPOSAL
department: "Architecture"
requirements:
  knowledge:
    - architecture-principles
    - standards
    - adrs
    - roadmaps
  data:
    - system-map
    - dependencies
    - application-portfolio
    - technical-debt
  tools:
    - diagramming
    - service-catalog
    - code-search
    - documentation
    - dependency-analysis
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
  observability:
    - run-tracing
    - token-accounting
    - audit-events
outputs:
