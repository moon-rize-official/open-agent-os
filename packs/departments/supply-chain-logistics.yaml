version: 1
id: supply-chain-logistics
kind: DepartmentResourcePack
status: PROPOSAL
department: "Supply Chain & Logistics"
requirements:
  knowledge:
    - supplier-policy
    - logistics-procedures
    - quality-requirements
  data:
    - suppliers
    - inventory
    - orders
    - routes
    - lead-times
    - disruptions
  tools:
    - erp
    - warehouse-management
    - transport-management
    - supplier-portal
    - analytics
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
  observability:
    - run-tracing
    - token-accounting
    - audit-events
outputs:
  - supply-plan
  - order-action
  - logistics-plan
  - exception-report
defaults:
  authority: least-privilege
  provenance_required: true
  provider_binding: organization-policy
