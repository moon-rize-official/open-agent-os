version: 1
id: quality-reliability
kind: DepartmentResourcePack
status: PROPOSAL
department: "Quality & Reliability"
requirements:
  knowledge:
    - quality-standards
    - release-criteria
    - test-strategy
    - slo-definitions
  data:
    - test-results
    - defects
    - incidents
    - slo-metrics
    - release-state
  tools:
    - ci
    - test-framework
    - quality-analysis
    - observability
    - release-gate
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
  observability:
    - run-tracing
    - token-accounting
    - audit-events
outputs:
  - test-report
  - release-decision
  - quality-finding
  - reliability-review
defaults:
  authority: least-privilege
  provenance_required: true
  provider_binding: organization-policy
