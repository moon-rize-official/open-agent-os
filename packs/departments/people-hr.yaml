version: 1
id: people-hr
kind: DepartmentResourcePack
status: PROPOSAL
department: "People & HR"
requirements:
  knowledge:
    - hr-policy
    - role-framework
    - benefit-policy
    - hiring-process
  data:
    - organization-data
    - approved-employee-fields
    - recruiting-state
    - training-state
  tools:
    - hris
    - recruiting-system
    - payroll
    - document-management
    - scheduling
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
  observability:
    - run-tracing
    - token-accounting
    - audit-events
outputs:
  - hr-action
  - role-record
  - hiring-artifact
  - workforce-report
defaults:
  authority: least-privilege
  provenance_required: true
  provider_binding: organization-policy
