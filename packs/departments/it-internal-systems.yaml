version: 1
id: it-internal-systems
kind: DepartmentResourcePack
status: PROPOSAL
department: "IT & Internal Systems"
requirements:
  knowledge:
    - internal-system-docs
    - support-runbooks
    - device-policy
  data:
    - user-directory
    - endpoint-inventory
    - software-inventory
    - support-tickets
  tools:
    - helpdesk
    - device-management
    - identity-management
    - inventory
    - remote-support
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
  observability:
    - run-tracing
    - token-accounting
    - audit-events
outputs:
  - support-action
  - asset-record
  - access-change
  - incident-ticket
defaults:
  authority: least-privilege
  provenance_required: true
  provider_binding: organization-policy
