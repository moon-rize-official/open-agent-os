version: 1
id: ai-platform
kind: DepartmentResourcePack
status: PROPOSAL
department: "AI Platform"
requirements:
  knowledge:
    - model-serving-architecture
    - model-policies
    - evaluation-standards
    - gpu-operations
  data:
    - model-registry
    - gpu-state
    - inference-metrics
    - quotas
    - evaluation-results
  tools:
    - inference-server
    - model-registry
    - scheduler
    - gpu-monitoring
    - evaluation-runner
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
  observability:
    - run-tracing
    - token-accounting
    - audit-events
outputs:
  - model-service
  - routing-config
  - capacity-plan
  - evaluation
defaults:
  authority: least-privilege
  provenance_required: true
  provider_binding: organization-policy
