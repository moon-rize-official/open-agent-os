version: 1
id: customer-success
kind: DepartmentResourcePack
status: PROPOSAL
department: "Customer Success"
requirements:
  knowledge:
    - product-guides
    - success-playbooks
    - account-strategy
  data:
    - account-goals
    - usage-data
    - health-scores
    - renewal-state
    - support-history
  tools:
    - crm
    - product-analytics
    - ticketing
    - communication
    - calendar
  integrations:
    - capability-registry
    - organization-directory
    - audit-service
  models:
    - general-llm
  skills:
    - evidence-recording
    - task-handoff
