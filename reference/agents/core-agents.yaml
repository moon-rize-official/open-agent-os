version: 2
status: public-reference-archetypes
source_class: PRE-PUBLIC-RESEARCH
note: >
  Functional public role archetypes distilled from earlier internal research.
  Implementations may rename, merge, split, or replace them.
agents:
  - id: coordinator
    role: chief-coordinator
    purpose: classify work, form teams, coordinate dependencies, request verification, return results
  - id: policy-authority
    role: governance-authority
    purpose: policy, authorization, approval, ownership and risk checks
  - id: architecture-lead
    role: architecture-product-lead
    purpose: architecture, requirements decomposition, technical strategy and product planning
  - id: implementation-lead
    role: implementation-lead
    purpose: code, refactoring, automation, builds and implementation tests
  - id: systems-lead
    role: systems-platform-lead
    purpose: distributed systems, infrastructure architecture, integration and deployment design
  - id: inventory-agent
    role: infrastructure-inventory
    purpose: read-mostly collection of current hardware, services, storage, network and utilization
  - id: security-lead
    role: security-lead
    purpose: threat analysis, IAM, secrets, hardening, application and network security
  - id: verification-lead
    role: independent-verification
    purpose: audit, evidence gathering, regression review and independent validation
  - id: knowledge-lead
    role: knowledge-lead
    purpose: ingestion, provenance, deduplication, classification, memory promotion and conflict detection
  - id: research-lead
    role: research-lead
    purpose: external research, standards, comparative analysis and source gathering
  - id: documentation-lead
    role: documentation-lead
    purpose: technical documentation, runbooks, structured reports and consistency
  - id: creative-lead
    role: creative-lead
    purpose: concept development, creative direction and media/content ideation
